<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bosch Slide Template</title>
<style>
    :root {
      --bosch-red: #ED0007;
      --bosch-blue: #1178BD;
      --bosch-blue-dark: #0E5E91;
      --bosch-black: #000000;
      --bosch-mid-gray: #6F6F6F;
      --bosch-light-gray: #EDEDED;
      --bosch-panel: #F7F7F7;
      --bosch-border: #D0D0D0;
      --bosch-green: #00884A;
      --bosch-amber: #F7A600;
      --bosch-purple: #7F56D9;
      --canvas-bg: #D9D9D9;
      --slide-bg: #FFFFFF;
      --slide-width: 1365px;
      --slide-height: 768px;
      --footer-gray: #A6A6A6;
      --footer-line-height: 1.35;
      --supergraphic-height: 8px;
      --font: 'Bosch Sans', 'Arial', 'Helvetica Neue', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--canvas-bg);
      font-family: var(--font);
      color: var(--bosch-black);
    }
    .deck {
      counter-reset: slide;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 24px 0 40px;
    }
    .slide {
      counter-increment: slide;
      position: relative;
      width: var(--slide-width);
      height: var(--slide-height);
      background: var(--slide-bg);
      border: 1px solid #C4C4C4;
      overflow: hidden;
    }
    .slide-topic {
      position: absolute;
      left: 26px;
      top: 24px;
      margin: 0;
      font-family: 'Bosch Sans', 'Arial', 'Helvetica Neue', sans-serif;
      font-size: 42px;
      line-height: 1.05;
      font-weight: 700;
      color: var(--bosch-black);
      letter-spacing: 0;
    }
    .slide-title-wrap {
      position: absolute;
      left: 25px;
      right: 25px;
      top: 84px;
      min-height: 40px;
      display: flex;
      align-items: center;
      padding: 0;
    }
    .slide-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.18;
      font-weight: 500;
      color: var(--bosch-blue);
    }
    .slide-content {
      position: absolute;
      left: 25px;
      right: 25px;
      top: 135px;
      bottom: 64px;
      overflow: hidden;
    }
    .page-number {
      position: absolute;
      left: 34px;
      bottom: 37px;
      font-size: 16px;
      line-height: 1;
      color: #8C949C;
      font-weight: 500;
    }
    .page-number::before { content: counter(slide); }
    .slide-footer {
      position: absolute;
      left: 75px;
      right: 190px;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .slide-footer__line1 {
      font-size: 11px;
      line-height: var(--footer-line-height);
      color: #555555;
      white-space: nowrap;
    }
    .slide-footer__line1 strong {
      color: var(--bosch-red);
      font-weight: 700;
    }
    .slide-footer__line2 {
      font-size: 10px;
      line-height: var(--footer-line-height);
      color: var(--footer-gray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slide-logo {
      position: absolute;
      right: 26px;
      bottom: 8px;
      width: 165px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }
    .slide-logo svg {
      display: block;
      width: 165px;
      height: auto;
    }
    .slide-supergraphic {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--supergraphic-height);
      overflow: hidden;
    }
    .slide-supergraphic svg {
      display: block;
      width: 100%;
      height: var(--supergraphic-height);
    }
    .muted { color: var(--bosch-mid-gray); }
    .small { font-size: 14px; }
    .lead {
      font-size: 22px;
      line-height: 1.45;
      color: #303030;
      max-width: 920px;
    }
    .two-col {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 24px;
      height: 100%;
    }
    .three-col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .panel {
      background: var(--bosch-panel);
      border: 1px solid var(--bosch-border);
      border-radius: 8px;
      padding: 18px 20px;
    }
    .panel h3, .card h3, .number-card h3 {
      margin: 0 0 10px;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 600;
      color: var(--bosch-black);
    }
    ul.clean {
      margin: 8px 0 0 0;
      padding-left: 22px;
      font-size: 20px;
      line-height: 1.5;
      color: #303030;
    }
    ul.clean li + li { margin-top: 10px; }
    .agenda {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 24px;
      align-items: stretch;
      height: 100%;
    }
    .agenda-steps {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .agenda-step {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 16px;
      align-items: center;
      padding: 16px 18px;
      border: 1px solid var(--bosch-border);
      border-radius: 8px;
      background: linear-gradient(90deg, #FFFFFF 0%, #F8FBFE 100%);
    }
    .agenda-step .index {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--bosch-blue);
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .agenda-step .text strong {
      display: block;
      font-size: 20px;
      margin-bottom: 4px;
    }
    .agenda-step .text span {
      color: var(--bosch-mid-gray);
      font-size: 16px;
      line-height: 1.35;
    }
    .cover-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 28px;
      height: 100%;
    }
    .hero-block {
      height: 100%;
      padding: 24px 8px 8px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .cover-topic {
      font-size: 48px;
      line-height: 1.05;
      font-weight: 700;
      margin: 0 0 18px;
    }
    .cover-subtitle {
      font-size: 26px;
      color: var(--bosch-blue);
      font-weight: 500;
      margin: 0 0 24px;
    }
    .cover-meta {
      display: grid;
      grid-template-columns: repeat(2, max-content);
      gap: 12px 28px;
      font-size: 18px;
      color: #404040;
    }
    .hero-visual {
      position: relative;
      background: linear-gradient(135deg, #F7F7F7 0%, #EDF6FB 55%, #FFFFFF 100%);
      border: 1px solid var(--bosch-border);
      border-radius: 12px;
      overflow: hidden;
    }
    .hero-visual::before, .hero-visual::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      opacity: 0.9;
    }
    .hero-visual::before {
      width: 330px; height: 330px;
      right: -48px; top: 18px;
      background: radial-gradient(circle at 40% 40%, rgba(17,120,189,0.18), rgba(17,120,189,0.03) 70%, transparent 72%);
      border: 2px solid rgba(17,120,189,0.15);
    }
    .hero-visual::after {
      width: 260px; height: 260px;
      left: 36px; bottom: 24px;
      background: radial-gradient(circle at 60% 60%, rgba(237,0,7,0.10), rgba(237,0,7,0.02) 68%, transparent 70%);
      border: 2px solid rgba(237,0,7,0.10);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: rgba(17,120,189,0.08);
      border: 1px solid rgba(17,120,189,0.18);
      border-radius: 999px;
      font-size: 15px;
      color: var(--bosch-blue-dark);
      margin-right: 8px;
      margin-bottom: 8px;
    }
    .section-banner {
      height: 100%;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
      align-items: center;
    }
    .section-banner .left {
      padding-right: 20px;
    }
    .section-banner .kicker {
      color: var(--bosch-red);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .section-banner .big {
      font-size: 44px;
      line-height: 1.08;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .section-banner .desc {
      font-size: 21px;
      line-height: 1.45;
      color: #3A3A3A;
      max-width: 760px;
    }
    .section-banner .right {
      height: 100%;
      min-height: 260px;
      background: linear-gradient(135deg, #F5F5F5, #F0F8FC);
      border: 1px solid var(--bosch-border);
      border-radius: 12px;
      padding: 26px;
      display: grid;
      gap: 16px;
      align-content: center;
    }
    .mini-metric {
      display: grid;
      grid-template-columns: minmax(130px, max-content) 1fr;
      gap: 16px;
      align-items: center;
    }
    .mini-metric .value {
      font-size: 32px;
      font-weight: 700;
      color: var(--bosch-blue-dark);
      white-space: nowrap;
    }
    .mini-metric .label {
      font-size: 17px;
      color: #3A3A3A;
    }
    .number-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 18px;
    }
    .number-card {
      background: linear-gradient(180deg, #FFFFFF 0%, #F8F8F8 100%);
      border: 1px solid var(--bosch-border);
      border-radius: 10px;
      padding: 18px;
    }
    .number-card .kpi {
      font-size: 38px;
      line-height: 1;
      font-weight: 700;
      color: var(--bosch-blue-dark);
      margin-bottom: 10px;
    }
    .number-card .caption {
      font-size: 15px;
      line-height: 1.4;
      color: var(--bosch-mid-gray);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid var(--bosch-border);
      border-radius: 10px;
      padding: 18px;
      min-height: 168px;
    }
    .card p {
      margin: 0;
      font-size: 17px;
      line-height: 1.45;
      color: #3B3B3B;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle;
    }
    .green { background: var(--bosch-green); }
    .amber { background: var(--bosch-amber); }
    .red { background: var(--bosch-red); }
    .timeline {
      display: grid;
      grid-template-columns: 180px repeat(6, 1fr);
      gap: 6px;
      align-items: center;
      font-size: 15px;
      margin-top: 14px;
    }
    .timeline .head {
      color: var(--bosch-mid-gray);
      font-weight: 600;
      text-align: center;
      padding-bottom: 6px;
    }
    .timeline .row-label {
      font-weight: 600;
      color: #404040;
      padding-right: 10px;
    }
    .bar-cell {
      height: 28px;
      border-radius: 6px;
      background: #ECECEC;
      position: relative;
      overflow: hidden;
    }
    .bar-fill {
      position: absolute; top: 0; left: 0; bottom: 0;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--bosch-blue) 0%, #37A0D8 100%);
    }
    .bar-fill.redish { background: linear-gradient(90deg, #F06A6F 0%, var(--bosch-red) 100%); }
    .bar-fill.greenish { background: linear-gradient(90deg, #34A853 0%, var(--bosch-green) 100%); }
    .matrix-wrap {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 22px;
      height: 100%;
    }
    .risk-list .risk-item {
      padding: 14px 16px;
      border: 1px solid var(--bosch-border);
      border-left: 6px solid var(--bosch-red);
      background: #FFF8F8;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .risk-item.amberish { border-left-color: var(--bosch-amber); background: #FFF9EE; }
    .risk-item.greenish { border-left-color: var(--bosch-green); background: #F5FCF7; }
    .risk-item strong { display: block; font-size: 18px; margin-bottom: 6px; }
    .risk-item span { font-size: 15px; color: #494949; line-height: 1.4; }
    .matrix {
      position: relative;
      border: 1px solid var(--bosch-border);
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(180deg, #FFFFFF 0%, #FAFAFA 100%);
      padding: 12px 12px 34px 42px;
    }
    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      height: 330px;
      gap: 1px;
      background: var(--bosch-border);
    }
    .matrix-grid div {
      background: rgba(255,255,255,0.92);
      position: relative;
    }
    .matrix-grid div.low { background: #F5FCF7; }
    .matrix-grid div.mid { background: #FFF8EE; }
    .matrix-grid div.high { background: #FFF1F1; }
    .risk-tag {
      position: absolute;
      padding: 4px 10px;
      font-size: 13px;
      line-height: 1;
      border-radius: 999px;
      color: #FFFFFF;
      background: var(--bosch-blue);
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }
    .matrix .axis-x, .matrix .axis-y {
      position: absolute;
      font-size: 14px;
      color: var(--bosch-mid-gray);
      font-weight: 600;
    }
    .matrix .axis-x { left: 50%; bottom: 8px; transform: translateX(-50%); }
    .matrix .axis-y { left: 6px; top: 50%; transform: translateY(-50%) rotate(-90deg); transform-origin: left top; }
    .arch {
      display: grid;
      grid-template-columns: 220px 1fr 220px;
      gap: 18px;
      height: 100%;
      align-items: center;
    }
    .arch-stack { display: grid; gap: 14px; }
    .arch-box {
      border: 1px solid var(--bosch-border);
      border-radius: 10px;
      padding: 16px;
      background: #FFFFFF;
      box-shadow: 0 1px 0 rgba(0,0,0,0.03);
    }
    .arch-box strong { display: block; font-size: 18px; margin-bottom: 6px; }
    .arch-box span { font-size: 15px; line-height: 1.38; color: #4A4A4A; }
    .arch-core {
      background: linear-gradient(180deg, #F7FBFE 0%, #FFFFFF 100%);
      border: 1px solid var(--bosch-border);
      border-radius: 12px;
      padding: 18px;
      position: relative;
      min-height: 360px;
    }
    .arch-layer {
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid rgba(17,120,189,0.15);
      background: rgba(17,120,189,0.06);
    }
    .arch-layer.redish { border-color: rgba(237,0,7,0.18); background: rgba(237,0,7,0.05); }
    .arch-layer.neutral { border-color: rgba(0,0,0,0.08); background: rgba(0,0,0,0.035); }
    .arch-arrow {
      position: absolute; left: 50%; width: 2px; background: var(--bosch-border);
    }
    .flow {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      align-items: stretch;
      margin-top: 18px;
    }
    .flow-step {
      position: relative;
      border: 1px solid var(--bosch-border);
      border-radius: 10px;
      background: #FFFFFF;
      padding: 18px 16px;
      min-height: 210px;
    }
    .flow-step .badge {
      width: 38px; height: 38px; border-radius: 50%; background: var(--bosch-blue); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; margin-bottom: 14px;
    }
    .flow-step p { font-size: 16px; color: #4A4A4A; line-height: 1.4; margin: 0; }
    .flow-step::after {
      content: '→';
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 28px;
      color: var(--bosch-border);
      font-weight: 700;
    }
    .flow-step:last-child::after { display: none; }
    .chart-panel {
      border: 1px solid var(--bosch-border);
      border-radius: 10px;
      background: #FFFFFF;
      padding: 16px 18px 18px;
    }
    .chart-title { font-size: 19px; font-weight: 600; margin: 0 0 8px; }
    .chart-sub { color: var(--bosch-mid-gray); font-size: 14px; margin-bottom: 10px; }
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      height: 100%;
    }
    svg text { font-family: var(--font); }
    .caption-row {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .caption-box {
      padding: 12px 14px;
      background: var(--bosch-panel);
      border: 1px solid var(--bosch-border);
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.4;
      color: #494949;
    }
    .image-layout {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 22px;
      height: 100%;
    }
    .image-box {
      border: 1px solid var(--bosch-border);
      border-radius: 12px;
      background: linear-gradient(135deg, #F7F7F7 0%, #EEF5FA 100%);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }
    .image-box .placeholder-title {
      position: absolute;
      top: 16px; left: 18px;
      font-size: 16px;
      font-weight: 600;
      color: var(--bosch-mid-gray);
    }
    .image-box svg { width: 100%; height: calc(100% - 12px); margin-top: 16px; }
    .callout {
      border-left: 4px solid var(--bosch-blue);
      padding-left: 12px;
      margin: 18px 0;
      font-size: 17px;
      line-height: 1.45;
      color: #434343;
    }
    table.clean-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
      line-height: 1.35;
    }
    table.clean-table th, table.clean-table td {
      border: 1px solid var(--bosch-border);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    table.clean-table th {
      background: #F6F9FB;
      font-weight: 700;
    }
    .next-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 22px;
      height: 100%;
    }
    .checklist { display: grid; gap: 12px; }
    .check-item {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 12px;
      align-items: start;
      font-size: 18px;
      line-height: 1.45;
      color: #303030;
    }
    .check-item .tick {
      width: 28px; height: 28px; border-radius: 50%; background: var(--bosch-green); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .roadmap {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 14px;
    }
    .roadmap-phase {
      border: 1px solid var(--bosch-border);
      border-top: 6px solid var(--bosch-blue);
      border-radius: 10px;
      padding: 16px;
      background: #fff;
      min-height: 180px;
    }
    .roadmap-phase.redish { border-top-color: var(--bosch-red); }
    .roadmap-phase.greenish { border-top-color: var(--bosch-green); }
    .roadmap-phase.purpleish { border-top-color: var(--bosch-purple); }
    .roadmap-phase strong { display: block; font-size: 18px; margin-bottom: 8px; }
    .roadmap-phase span { font-size: 15px; line-height: 1.42; color: #4A4A4A; }
    .end-page {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      padding-left: 6px;
      gap: 16px;
    }
    .end-page .thanks {
      font-size: 52px;
      line-height: 1;
      font-weight: 700;
      margin: 0;
    }
    .end-page .note {
      font-size: 24px;
      line-height: 1.35;
      color: var(--bosch-blue);
      max-width: 900px;
      margin: 0;
    }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
    .legend span { font-size: 14px; color: #4A4A4A; display: inline-flex; align-items: center; gap: 8px; }
    .legend i { width: 12px; height: 12px; display: inline-block; border-radius: 3px; }
    .cover-strip { margin-top: 24px; }
    @media print {
      @page { size: 1365px 768px; margin: 0; }
      body { background: #FFFFFF; }
      .deck { gap: 0; padding: 0; }
      .slide { page-break-after: always; break-after: page; border: none; }
    }

    .cover-bg-slide::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.32) 34%, rgba(0,0,0,0.34) 100%);
      pointer-events: none;
      z-index: 0;
    }
    .cover-bg-slide > * {
      position: relative;
      z-index: 1;
    }
    .cover-simple {
      position: absolute;
      left: 70px;
      right: 70px;
      top: 110px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #FFFFFF;
    }
    .cover-simple-title {
      margin: 0;
      font-size: 54px;
      line-height: 1.15;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 3px 12px rgba(0,0,0,0.30);
      max-width: 1050px;
    }
    .cover-simple-meta {
      display: inline-flex;
      justify-content: center;
      align-items: stretch;
      margin-top: 8px;
      background: rgba(20, 20, 20, 0.24);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.16);
    }
    .cover-simple-meta .item {
      min-width: 230px;
      padding: 18px 34px;
      background: transparent;
      box-shadow: none;
      border-radius: 0;
      position: relative;
    }
    .cover-simple-meta .item + .item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 22%;
      bottom: 22%;
      width: 1px;
      background: rgba(255,255,255,0.22);
    }
    .cover-simple-meta .label {
      font-size: 15px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 10px;
      color: rgba(255,255,255,0.82);
    }
    .cover-simple-meta .value {
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #FFFFFF;
    }

  
    .cover-title-bar {
      width: 420px;
      height: 5px;
      background: #ED0007;
      margin: 18px auto 32px;
      border-radius: 999px;
      box-shadow: 0 2px 10px rgba(237,0,7,0.28);
    }

  

    /* Clean fullscreen presentation mode (no visible controls) */
    .slide {
      position: relative;
    }
    .deck > .slide[data-slide-index] {
      cursor: zoom-in;
    }
    .deck > .slide:focus-visible {
      outline: 3px solid rgba(17,120,189,0.35);
      outline-offset: -3px;
    }

    .slide-viewer {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      background: #0b0f14;
      color: #fff;
      cursor: pointer;
    }
    .slide-viewer.is-open { display: block; }
    .slide-viewer__stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .slide-viewer__canvas {
      position: relative;
      width: var(--slide-width);
      height: var(--slide-height);
      transform-origin: center center;
      will-change: transform;
    }
    .slide-viewer__canvas > .slide {
      margin: 0;
      box-shadow: 0 18px 40px rgba(0,0,0,0.30);
      cursor: default;
    }
    .slide-viewer__page {
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 2;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.42);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 13px;
      color: rgba(255,255,255,0.92);
      pointer-events: none;
      backdrop-filter: blur(8px);
    }
    .slide-viewer__zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 18vw;
      z-index: 1;
      background: transparent;
    }
    .slide-viewer__zone.prev { left: 0; cursor: w-resize; }
    .slide-viewer__zone.next { right: 0; cursor: e-resize; }
    body.viewer-open { overflow: hidden; }

    .print-host {
      display: none;
    }

    @media print {
      .slide-viewer,
      .print-host {
        display: none !important;
      }
      body.print-current .deck {
        display: none !important;
      }
      body.print-current .print-host {
        display: block !important;
      }
      body.print-current .print-host .slide {
        page-break-after: always;
        break-after: page;
        border: none;
        margin: 0;
      }
    }

  </style>

<div class="slide-viewer" id="slideViewer" aria-hidden="true">
    <div class="slide-viewer__stage" id="slideViewerStage">
      <div class="slide-viewer__canvas" id="slideViewerCanvas"></div>
  <div class="print-host" id="printHost" aria-hidden="true"></div>
<script>
(() => {
  const slides = Array.from(document.querySelectorAll('.deck > .slide'));
  if (!slides.length) return;

  const viewer = document.getElementById('slideViewer');
  const viewerStage = document.getElementById('slideViewerStage');
  const viewerCanvas = document.getElementById('slideViewerCanvas');
  const viewerPage = document.getElementById('slideViewerPage');
  const prevZone = document.getElementById('slideViewerPrevZone');
  const nextZone = document.getElementById('slideViewerNextZone');
  const printHost = document.getElementById('printHost');

  let currentIndex = 0;
  let selectedIndex = 0;
  let lastFocusedEl = null;
  let activeSlide = null;
  let placeholder = null;
  let printCleanupTimer = null;

  slides.forEach((slide, index) => {
    slide.dataset.slideIndex = String(index);
    slide.setAttribute('tabindex', '0');
    slide.addEventListener('focus', () => {
      selectedIndex = index;
    });
    slide.addEventListener('click', () => {
      selectedIndex = index;
    });
    slide.addEventListener('dblclick', () => openViewer(index));
    slide.addEventListener('keydown', (event) => {
      if ((event.key === 'Enter' || event.key === ' ') && !event.target.closest('button, a, input, textarea, select')) {
        event.preventDefault();
        openViewer(index);
      } else if (event.key.toLowerCase() === 'f') {
        event.preventDefault();
        openViewer(index);
      } else if (event.key.toLowerCase() === 'p' && !event.ctrlKey && !event.metaKey) {
        event.preventDefault();
        printSingleSlide(index);
      }
    });
  });

  function getSlideSize() {
    const root = getComputedStyle(document.documentElement);
    const width = parseFloat(root.getPropertyValue('--slide-width')) || 1365;
    const height = parseFloat(root.getPropertyValue('--slide-height')) || 768;
    return { width, height };
  }

  function restoreActiveSlide() {
    if (activeSlide && placeholder && placeholder.parentNode) {
      placeholder.replaceWith(activeSlide);
    }
    activeSlide = null;
    placeholder = null;
  }

  function renderSlide(index) {
    currentIndex = Math.max(0, Math.min(index, slides.length - 1));
    selectedIndex = currentIndex;
    restoreActiveSlide();
    viewerCanvas.innerHTML = '';

    activeSlide = slides[currentIndex];
    placeholder = document.createComment('slide-placeholder');
    activeSlide.parentNode.insertBefore(placeholder, activeSlide);
    viewerCanvas.appendChild(activeSlide);

    viewerPage.textContent = `${currentIndex + 1} / ${slides.length}`;
    fitViewer();
  }

  function fitViewer() {
    if (!viewer.classList.contains('is-open')) return;
    const { width, height } = getSlideSize();
    const stageRect = viewerStage.getBoundingClientRect();
    const scale = Math.min(stageRect.width / width, stageRect.height / height);
    viewerCanvas.style.transform = `scale(${Math.max(scale, 0.1)})`;
  }

  async function enterFullscreen() {
    try {
      if (!document.fullscreenElement) {
        await viewer.requestFullscreen();
      }
    } catch (err) {
      console.warn('Fullscreen API unavailable:', err);
    }
  }

  function openViewer(index) {
    lastFocusedEl = document.activeElement;
    viewer.classList.add('is-open');
    viewer.setAttribute('aria-hidden', 'false');
    document.body.classList.add('viewer-open');
    renderSlide(index);
    enterFullscreen();
  }

  function closeViewer() {
    viewer.classList.remove('is-open');
    viewer.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('viewer-open');
    if (document.fullscreenElement === viewer) {
      document.exitFullscreen().catch(() => {});
    }
    restoreActiveSlide();
    viewerCanvas.innerHTML = '';
    if (lastFocusedEl && typeof lastFocusedEl.focus === 'function') {
      lastFocusedEl.focus({ preventScroll: true });
    }
  }

  function goPrev() {
    if (currentIndex > 0) {
      renderSlide(currentIndex - 1);
    }
  }

  function goNext() {
    if (currentIndex < slides.length - 1) {
      renderSlide(currentIndex + 1);
    }
  }

  function clearPrintHost() {
    clearTimeout(printCleanupTimer);
    document.body.classList.remove('print-current');
    printHost.innerHTML = '';
  }

  function printSingleSlide(index) {
    clearPrintHost();
    const safeIndex = Math.max(0, Math.min(index, slides.length - 1));
    const clone = slides[safeIndex].cloneNode(true);
    clone.removeAttribute('tabindex');
    clone.querySelectorAll('[id]').forEach((node) => node.removeAttribute('id'));
    printHost.appendChild(clone);
    document.body.classList.add('print-current');
    window.print();
    printCleanupTimer = window.setTimeout(clearPrintHost, 1000);
  }

  prevZone.addEventListener('click', (event) => {
    event.stopPropagation();
    goPrev();
  });
  nextZone.addEventListener('click', (event) => {
    event.stopPropagation();
    goNext();
  });
  viewer.addEventListener('click', (event) => {
    if (event.target === viewerStage || event.target === viewerCanvas) {
      goNext();
    }
  });

  window.addEventListener('resize', fitViewer);
  window.addEventListener('afterprint', clearPrintHost);
  document.addEventListener('fullscreenchange', () => {
    fitViewer();
  });

  document.addEventListener('keydown', (event) => {
    const activeEl = document.activeElement;
    const isEditable = activeEl && (activeEl.matches('input, textarea, select') || activeEl.isContentEditable);
    if (isEditable) return;

    if (viewer.classList.contains('is-open')) {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeViewer();
      } else if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
        event.preventDefault();
        goPrev();
      } else if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') {
        event.preventDefault();
        goNext();
      } else if (event.key === 'Home') {
        event.preventDefault();
        renderSlide(0);
      } else if (event.key === 'End') {
        event.preventDefault();
        renderSlide(slides.length - 1);
      } else if (event.key.toLowerCase() === 'f') {
        event.preventDefault();
        if (document.fullscreenElement === viewer) {
          document.exitFullscreen().catch(() => {});
        } else {
          enterFullscreen();
        }
      } else if (event.key.toLowerCase() === 'p' && !event.ctrlKey && !event.metaKey) {
        event.preventDefault();
        printSingleSlide(currentIndex);
      }
      return;
    }

    if ((event.key.toLowerCase() === 'f' || event.key === 'Enter') && !event.ctrlKey && !event.metaKey) {
      const targetSlide = activeEl && activeEl.classList && activeEl.classList.contains('slide')
        ? Number(activeEl.dataset.slideIndex || selectedIndex)
        : selectedIndex;
      event.preventDefault();
      openViewer(targetSlide);
    } else if (event.key.toLowerCase() === 'p' && !event.ctrlKey && !event.metaKey) {
      event.preventDefault();
      printSingleSlide(selectedIndex);
    }
  });
})();
</script>
